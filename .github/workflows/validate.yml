name: Validate RaportFinansowy24

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Firebase is fully decommissioned
        run: npm run check:firebase-free

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build
